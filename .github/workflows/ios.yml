# Negusify for iPhone: builds the app on a GitHub Mac, tests it in the iOS simulator, and makes an
# unsigned .ipa (install it with Sideloadly / AltStore, which sign it with your Apple ID).
# This branch holds the iPhone app from projectX (negusify-mobile/); the .ipa is published with the
# Negusify release there, next to the Windows installer.
name: Negusify iPhone

on:
  push:
    branches: [negusify]
  workflow_dispatch:

concurrency:
  group: negusify-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build + test in simulator
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Can this network reach YouTube? (plain Node, no app)
        continue-on-error: true
        run: |
          cat > yt-net.mjs <<'JS'
          import { Innertube, UniversalCache } from 'youtubei.js'
          const yt = await Innertube.create({ retrieve_player: false, generate_session_locally: true, cache: new UniversalCache(false) })
          for (const client of ['TV_SIMPLY', 'IOS', 'YTMUSIC']) {
            try {
              const info = await yt.getBasicInfo('FGBhQbmPwH8', { client })
              console.log(client, info.playability_status?.status, info.playability_status?.reason ?? '')
            } catch (e) { console.log(client, 'ERR', e.message) }
          }
          JS
          node yt-net.mjs
          cat > sc-net.mjs <<'JS'
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          const html = await (await fetch('https://soundcloud.com/', { headers: { 'User-Agent': UA } })).text()
          const scripts = [...html.matchAll(new RegExp('<script[^>]+src="(https://a-v2[.]sndcdn[.]com/assets/[^"]+[.]js)"', 'g'))].map((m) => m[1]).reverse()
          let cid
          for (const s of scripts) { const m = (await (await fetch(s)).text()).match(new RegExp('client_id[ ]*[:=][ ]*"([a-zA-Z0-9]{32})"')); if (m) { cid = m[1]; break } }
          const get = async (u, p = {}) => { const r = await fetch(`${u}${u.includes('?') ? '&' : '?'}${new URLSearchParams({ client_id: cid, ...p })}`, { headers: { 'User-Agent': UA } }); return { status: r.status, body: r.ok ? await r.json() : null } }
          for (const q of ['daft punk one more time', 'lofi chill beat']) {
            const s = await get('https://api-v2.soundcloud.com/search/tracks', { q, limit: '8' })
            for (const t of (s.body?.collection ?? []).slice(0, 3)) {
              const auth = t.track_authorization ? { track_authorization: t.track_authorization } : {}
              const res = []
              for (const tr of t.media?.transcodings ?? []) res.push(`${tr.preset}/${tr.format.protocol}:${(await get(tr.url, auth)).status}`)
              const tr = { preset: res.join(' ') }
              const st = { status: '' }
              const one = await get(`https://api-v2.soundcloud.com/tracks/${t.id}`)
              console.log('SC', q, '|', t.title, '| policy', t.policy, '| tracks/id', one.status, '| stream', tr?.preset, st.status)
            }
          }
          JS
          node sc-net.mjs
      - name: Generate native project
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        run: cd ios && pod install
      - name: Build (Release, simulator)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Negusify.xcworkspace -scheme Negusify -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build > xcodebuild.log 2>&1 < /dev/null || true
          grep -E "error:|warning: .*NegusifyAudio|BUILD (SUCCEEDED|FAILED)|\*\* " xcodebuild.log || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log && test -f build/Build/Products/Release-iphonesimulator/Negusify.app/main.jsbundle
      - name: Show build errors
        if: failure()
        run: grep -E "error:" -A3 xcodebuild.log | head -150 || true
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Negusify.app
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: Launch + in-app diagnostics
        run: |
          mkdir -p e2e-out
          xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'process == "Negusify"' > sim.log 2>&1 &
          echo "LOGPID=$!" >> $GITHUB_ENV
          DATA=$(xcrun simctl get_app_container "$UDID" com.negusify.app data)
          mkdir -p "$DATA/Documents/.negusify"
          CROSS=''
          printf '%s' "$CROSS" > "$DATA/Documents/.negusify/run-diagnostics"
          xcrun simctl launch "$UDID" com.negusify.app
          sleep 20
          xcrun simctl io "$UDID" screenshot e2e-out/00-launch.png
          for i in $(seq 1 72); do
            [ -f "$DATA/Documents/.negusify/diagnostics.json" ] && break
            sleep 5
          done
          xcrun simctl io "$UDID" screenshot e2e-out/01-diagnostics.png
          if [ -f "$DATA/Documents/.negusify/diagnostics.json" ]; then
            cp "$DATA/Documents/.negusify/diagnostics.json" e2e-out/
            cat e2e-out/diagnostics.json
          else
            echo "DIAG_MISSING=1" >> $GITHUB_ENV
            echo "diagnostics did not finish"
          fi
      - name: UI test (Maestro)
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: |
          maestro --device "$UDID" test e2e/smoke.yaml --test-output-dir e2e-out \
            || (sleep 10 && maestro --device "$UDID" test e2e/smoke.yaml --test-output-dir e2e-out) \
            || echo "E2E_FAILED=1" >> $GITHUB_ENV
      - name: Collect logs
        if: always()
        run: |
          kill $LOGPID 2>/dev/null || true
          grep -E "\[diag\]" sim.log | tail -40 || true
          grep -iE "error|exception|\[diag\]|javascript" sim.log | grep -viE "nw_|networkd|CFNetwork|boringssl" | tail -120 > sim-errors.log || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: simulator-results
          path: |
            e2e-out
            sim.log
            sim-errors.log
            xcodebuild.log
          retention-days: 7
      - name: Fail if a test failed
        if: env.E2E_FAILED == '1' || env.DIAG_MISSING == '1'
        run: |
          echo "E2E_FAILED=$E2E_FAILED DIAG_MISSING=$DIAG_MISSING CROSS_FAILED=$CROSS_FAILED"
          exit 1
      - name: Fail if diagnostics found problems
        run: node -e "const d=require('./e2e-out/diagnostics.json'); console.log(d.passed+'/'+d.total); process.exit(d.passed===d.total?0:1)"

  ipa:
    name: Build .ipa for iPhone
    needs: simulator
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: cd ios && pod install
      - name: Build (Release, device, unsigned)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Negusify.xcworkspace -scheme Negusify -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" COMPILER_INDEX_STORE_ENABLE=NO \
            build > xcodebuild.log 2>&1 < /dev/null || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* " xcodebuild.log || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log && test -f build/Build/Products/Release-iphoneos/Negusify.app/main.jsbundle
      - name: Package .ipa
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Negusify.app Payload/
          zip -qry "Negusify-$VERSION.ipa" Payload
          ls -la *.ipa
      - uses: actions/upload-artifact@v5
        with:
          name: Negusify-ipa
          path: "*.ipa"
          retention-days: 30
